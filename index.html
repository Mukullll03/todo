<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>To Do</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #ffffff; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .checkbox-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const START_DATE = new Date('2026-08-23T00:00:00');
        const TOTAL_DAYS = 90;

        const mathsTopics = [
            "Percentage: Basics & Fractions", "Percentage: Elections & Exams", "Percentage: Successive Changes", "Percentage: PYQ Practice",
            "Ratio & Prop: Concepts & Coins", "Ratio & Prop: Income & Exp", "Ratio & Prop: Mixtures Basic", "Ratio: PYQ Practice",
            "Profit & Loss: Basics & Articles", "Profit & Loss: Dishonest Dealer", "Profit & Loss: Discount Concepts", "Profit & Loss: PYQ Practice",
            "Simple Interest: Concepts & Formulae", "Compound Interest: Successive Method", "SI & CI: Difference & Installments", "Interest: Mix PYQ",
            "Time & Work: Efficiency Concept", "Time & Work: Men, Women & Boys", "Pipe & Cistern: Fill & Empty", "Time & Work: PYQ Practice",
            "Speed Time Dist: Basics & Trains", "Speed Time Dist: Relative Speed", "Boat & Stream: Concepts", "TSD & Boats: Mix PYQ",
            "Number System: Divisibility Rules", "Number System: Remainder Theorem", "Number System: Unit Digit & Zeroes", "Number System: Mix PYQ",
            "Algebra: Basic Identities (a+b)^2", "Algebra: x + 1/x Concept", "Algebra: Value Putting", "Algebra: Mix PYQ",
            "Geometry: Lines, Angles & Triangles", "Geometry: Centers of Triangle", "Geometry: Circles & Tangents", "Geometry: Mix PYQ",
            "Mensuration 2D: Triangles & Quads", "Mensuration 2D: Circles", "Mensuration 3D: Cube, Cuboid, Cylinder", "Mensuration 3D: Cone & Sphere",
            "Trigonometry: Ratios & Identities", "Trigonometry: Max/Min & Value Putting", "Height & Distance", "Trigo: Mix PYQ"
        ]; 

        const englishTopics = [
            "Grammar: Noun Rules 1-10", "Grammar: Noun Rules 11-20 + Practice", "Grammar: Noun Exceptions",
            "Grammar: Pronoun Types", "Grammar: Pronoun Rules + Practice", "Grammar: Pronoun PYQs",
            "Grammar: Subject-Verb Agreement (Part 1)", "Grammar: Subject-Verb Agreement (Part 2)", "Grammar: Subject-Verb PYQs",
            "Grammar: Tenses (Present & Past)", "Grammar: Tenses (Future & Conditional)", "Grammar: Tenses PYQs",
            "Grammar: Prepositions (Fixed)", "Grammar: Prepositions (Confusing Pairs)", "Grammar: Preposition PYQs",
            "Grammar: Active & Passive Voice Basic", "Grammar: Voice (Interrogative & Imperative)", "Practice: Voice PYQs",
            "Grammar: Direct & Indirect Speech", "Grammar: Narration Exceptions", "Practice: Narration PYQs",
            "Grammar: Conjunctions & Rules", "Grammar: Articles (A, An, The)", "Grammar: Adverbs & Adjectives",
            "Mix Grammar Error Spotting (50 Qs)", "Mix Sentence Improvement (50 Qs)", "Grammar Sectional Revision"
        ];

        const reasoningTopics = [
            "Syllogism: Basic All/Some Concepts", "Syllogism: No/Some Not Concepts", "Syllogism: Possibility Cases & Only",
            "Direction & Distance: Basics", "Direction: Shadow & Degree Based", "Blood Relation: Family Tree",
            "Blood Relation: Pointing & Coded", "Venn Diagram: Logical & Data Based", "Coding-Decoding: Letter Shifting",
            "Coding-Decoding: Number & China Coding", "Number Series: Difference & Square/Cube", "Number Series: Wrong Number",
            "Alphabet Series & Analogy", "Number Analogy & Classification", "Dice: Standard, Ordinary & Open",
            "Cube & Cuboid: Cutting & Coloring", "Counting Figures: Triangles", "Counting Figures: Squares & Rectangles",
            "Mirror & Water Images", "Paper Folding & Cutting", "Embedded Figures & Pattern Completion",
            "Seating Arrangement: Linear", "Seating Arrangement: Circular", "Syllogism & Direction Mix Practice"
        ];

        const gsTopics = [
            // Geography (8)
            "Geo: India Location & Himalayas", "Geo: Peninsular Plateau, Northern Plains & Islands",
            "Geo: Himalayan & Peninsular River Systems", "Geo: Dams, Lakes, Waterfall & Monsoon",
            "Geo: Forest, Grassland & Soil", "Geo: Agriculture & Minerals",
            "Geo: World Map", "Geo: Human Geography & Transport",
            
            // Ancient History (6)
            "Ancient: Stone Age & Indus Valley", "Ancient: Vedic Age & Sangam Age",
            "Ancient: Jainism, Buddhism & Mahajanapadas", "Ancient: Maurya & Post-Maurya",
            "Ancient: Gupta & Post-Gupta", "Ancient: Tripartite Struggle & Cholas",
            
            // Medieval History (3)
            "Medieval: Delhi Sultanate", "Medieval: Vijayanagara, Bahmani & Mughal Empire",
            "Medieval: Marathas, Bhakti & Sufi Movements",
            
            // Modern History (5)
            "Modern: Advent of Europeans & Socio-Religious Reforms", "Modern: Revolt of 1857, INC & Bengal Partition",
            "Modern: Gandhian Era", "Modern: CDM, Simon Commission & Quit India",
            "Modern: Governor-General and Viceroy",
            
            // Polity (11)
            "Polity: Constitution Making, Features & Preamble", "Polity: Parts 1-2 & Fundamental Rights",
            "Polity: DPSP & Fundamental Duties", "Polity: President, VP, PM & Council",
            "Polity: Parliament & State Legislature", "Polity: Centre-State Relations & Emergency",
            "Polity: Supreme Court & High Court", "Polity: Local Government",
            "Polity: Const. & Non-Const. Bodies", "Polity: New Criminal Laws 2023 & Important Acts",
            "Polity: Sources of Const. & Noteworthy Points",
            
            // Economics (6)
            "Eco: Basics of Economy & Microeconomics", "Eco: National Income, Budget & Taxation",
            "Eco: Inflation, Unemployment & Poverty", "Eco: Banking Part 1 & Monetary Policy",
            "Eco: Banking Part 2 & Balance of Payment", "Eco: Five Year Plans, Indices & Institutions",
            
            // Physics (4)
            "Physics: Motion, Force & Laws of Motion", "Physics: Gravitation, Work Done & Sound",
            "Physics: Reflection, Refraction & Human Eye", "Physics: Electricity & Magnetic Effects",
            
            // Chemistry (4)
            "Chem: Matter, Atom & Periodic Table", "Chem: Chem Reactions, Metals & Non-Metals",
            "Chem: Acid, Base, Salt, Carbon & Compounds", "Chem: Sectional Revision & Mix PYQs",
            
            // Biology (6)
            "Bio: Cell, Plant & Animal Tissue", "Bio: Plant & Animal Kingdom",
            "Bio: Nervous System, Hormones & Movement", "Bio: Reproduction, Digestion & Respiration",
            "Bio: Circulatory & Excretory System", "Bio: Diseases, Nutrients, Heredity & Evolution",
            
            // Environment (3)
            "Env: Basics, Ecosystem & Energy Transfer", "Env: Biogeochemical Cycles & Conventions",
            "Env: National Parks",
            
            // Static GK (6)
            "GK: Music, Paintings & Classical Dance", "GK: Folk Dances & Festivals of India",
            "GK: Census & Important Days", "GK: Books, Authors & Sports",
            "GK: National & International Organisations", "GK: Awards and Honours & Miscellaneous"
        ];

        const generateDetailedSyllabus = () => {
            const plan = [];
            let mathIdx = 0, engIdx = 0, reasIdx = 0, gsIdx = 0;
            
            for (let i = 0; i < TOTAL_DAYS; i++) {
                const date = new Date(START_DATE.getTime() + i * 24 * 60 * 60 * 1000);
                const dayOfWeek = date.getDay(); 
                const isSunday = dayOfWeek === 0;
                const isSaturday = dayOfWeek === 6;
                
                const dayPlan = {
                    dayId: i + 1,
                    date: date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
                    dayType: isSunday ? 'sunday' : isSaturday ? 'saturday' : 'weekday',
                    tasks: []
                };

                if (isSunday) {
                    dayPlan.tasks = [
                        { id: `d${i}-m1`, timeSlot: "09:00 AM - 10:00 AM", subject: "Full Mock Test", topic: "Attempt 100 Qs Pre-Level Full Mock (Strictly timed)", type: "mock", icon: "fa-stopwatch" },
                        { id: `d${i}-m2`, timeSlot: "10:30 AM - 12:30 PM", subject: "Deep Mock Analysis", topic: "Analyze weak areas, note down unattempted/wrong Qs concepts", type: "mock", icon: "fa-magnifying-glass-chart" },
                        { id: `d${i}-rev`, timeSlot: "02:00 PM - 05:00 PM", subject: "Weakness Targeting", topic: "Study the specific topics you got wrong in today's mock", type: "revision", icon: "fa-target" },
                        { id: `d${i}-rest`, timeSlot: "05:00 PM - 10:00 PM", subject: "Brain Rest & Reset", topic: "No studies. Relax, prepare mentally for the upcoming week.", type: "gs", icon: "fa-couch" }
                    ];
                } else if (isSaturday) {
                    dayPlan.tasks = [
                        { id: `d${i}-s1`, timeSlot: "07:00 AM - 10:00 AM", subject: "Maths Weekly Rev", topic: "Re-solve all marked/hard questions from Mon-Fri. No new topic.", type: "revision", icon: "fa-calculator" },
                        { id: `d${i}-s2`, timeSlot: "10:30 AM - 01:00 PM", subject: "English Weekly Rev", topic: "Revise Grammar Rules & all Vocab/Idioms learned this week.", type: "revision", icon: "fa-book" },
                        { id: `d${i}-s3`, timeSlot: "02:00 PM - 05:00 PM", subject: "GS Weekly Rev", topic: "Active Recall & Short Notes revision of Mon-Fri GS topics.", type: "revision", icon: "fa-globe" },
                        { id: `d${i}-s4`, timeSlot: "05:30 PM - 07:30 PM", subject: "Reasoning & CA", topic: "Revise Reasoning tricks + Weekly Current Affairs reading.", type: "revision", icon: "fa-brain" },
                        { id: `d${i}-s5`, timeSlot: "08:30 PM - 10:30 PM", subject: "Mix Practice Set", topic: "Solve 100 mixed Qs covering all subjects studied this week.", type: "mock", icon: "fa-layer-group" }
                    ];
                } else {
                    const mTopic = i > 75 ? `Maths PYQ Mix Mock (Set ${i-75})` : mathsTopics[mathIdx % mathsTopics.length];
                    const eTopic = englishTopics[engIdx % englishTopics.length];
                    const rTopic = i > 75 ? `Reasoning Mix Mock (Set ${i-75})` : reasoningTopics[reasIdx % reasoningTopics.length];
                    const gTopic = gsTopics[gsIdx % gsTopics.length];

                    dayPlan.tasks = [
                        { id: `d${i}-t1`, timeSlot: "07:00 AM - 07:15 AM", subject: "Calculation", topic: "Speed Drill: Tables (1-30), Squares (1-50), Cubes (1-20), Fractions", type: "maths", icon: "fa-bolt" },
                        
                        { id: `d${i}-t2-core`, timeSlot: "07:15 AM - 09:30 AM", subject: "Maths", topic: mTopic, type: "maths", icon: "fa-square-root-variable" },
                        
                        { id: `d${i}-t3-core`, timeSlot: "10:00 AM - 11:30 AM", subject: "English Grammar", topic: eTopic, type: "english", icon: "fa-language" },
                        
                        { id: `d${i}-t4`, timeSlot: "11:30 AM - 01:00 PM", subject: "Vocab & Comprehension", topic: "Cloze Test, PQRS (Parajumbles) & daily 30 Vocab words practice", type: "english", icon: "fa-book-open" },
                        
                        { id: `d${i}-t5-core`, timeSlot: "02:00 PM - 04:00 PM", subject: "Gen. Studies", topic: gTopic, type: "gs", icon: "fa-monument" },
                        
                        { id: `d${i}-t6-core`, timeSlot: "04:30 PM - 06:00 PM", subject: "Reasoning", topic: rTopic, type: "reasoning", icon: "fa-puzzle-piece" },
                        
                        { id: `d${i}-t-ca`, timeSlot: "06:30 PM - 07:00 PM", subject: "Current Affairs", topic: "Daily News/Video & Short Notes", type: "gs", icon: "fa-newspaper" },

                        { id: `d${i}-t7`, timeSlot: "08:30 PM - 10:30 PM", subject: "Daily Sectional Mock", topic: "Practice MCQs/PYQs exclusively of the topics studied TODAY to lock memory.", type: "mock", icon: "fa-list-check" },
                        { id: `d${i}-t8`, timeSlot: "10:30 PM - 11:00 PM", subject: "Night Wrap-up", topic: "Plan tomorrow's schedule, brief current affairs reading, sleep.", type: "revision", icon: "fa-moon" }
                    ];

                    mathIdx++; engIdx++; reasIdx++; gsIdx++;
                }
                plan.push(dayPlan);
            }
            return plan;
        };

        const SubjectPill = ({ type, subject, icon }) => {
            const colors = {
                maths: 'bg-blue-100/20 text-blue-700 border-blue-200/30',
                english: 'bg-indigo-100/20 text-indigo-700 border-indigo-200/30',
                reasoning: 'bg-orange-100/20 text-orange-700 border-orange-200/30',
                gs: 'bg-emerald-100/20 text-emerald-700 border-emerald-200/30',
                revision: 'bg-purple-100/20 text-purple-700 border-purple-200/30',
                mock: 'bg-red-100/20 text-red-700 border-red-200/30',
                skill: 'bg-teal-100/20 text-teal-700 border-teal-200/30'
            };
            const c = colors[type] || 'bg-gray-100/20 text-gray-700';
            
            return (
                <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${c}`}>
                    <i className={`fa-solid ${icon}`}></i> {subject}
                </span>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('today');
            const [syllabus] = React.useState(generateDetailedSyllabus());
            const [isSyncing, setIsSyncing] = React.useState(false);
            const [showDaySelector, setShowDaySelector] = React.useState(false);
            const [taskLoading, setTaskLoading] = React.useState({}); 
            
            // Calculate actual today index once
            const getActualDayIndex = () => {
                const todayDateMidnight = new Date();
                todayDateMidnight.setHours(0, 0, 0, 0);
                const startStr = new Date(START_DATE);
                startStr.setHours(0, 0, 0, 0);
                const diffTime = todayDateMidnight - startStr;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                return Math.max(0, Math.min(diffDays, 89));
            };
            
            const actualDayIndex = getActualDayIndex();
            const [viewedDayIndex, setViewedDayIndex] = React.useState(actualDayIndex);

            const [completedTasks, setCompletedTasks] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('mission90_completed_tasks');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            });

            React.useEffect(() => {
                localStorage.setItem('mission90_completed_tasks', JSON.stringify(completedTasks));
            }, [completedTasks]);
            
            const todayDate = new Date();
            const nowTime = todayDate.getHours() * 100 + todayDate.getMinutes(); 
            
            const viewedData = syllabus[viewedDayIndex];

            const isCurrentlyActive = (timeSlotStr) => {
                if (viewedDayIndex !== actualDayIndex) return false;
                try {
                    const parts = timeSlotStr.split(' - ');
                    const parseTime = (str) => {
                        let [time, modifier] = str.split(' ');
                        let [hours, minutes] = time.split(':');
                        hours = parseInt(hours, 10);
                        if (hours === 12 && modifier === 'AM') hours = 0;
                        if (modifier === 'PM' && hours < 12) hours += 12;
                        return hours * 100 + parseInt(minutes, 10);
                    };
                    const start = parseTime(parts[0]);
                    const end = parseTime(parts[1]);
                    return nowTime >= start && nowTime < end;
                } catch(e) { return false; }
            };

            const toggleTask = async (task) => {
                if (taskLoading[task.id]) return; // Prevent double clicking while syncing

                const newStatus = !completedTasks[task.id];
                
                // Show loading state for this specific task
                setTaskLoading(prev => ({ ...prev, [task.id]: true }));
                
                // Wait for the sync to complete
                const success = await syncToGoogleSheet(task, newStatus);
                
                // Once successful, update the UI tick mark
                if (success) {
                    setCompletedTasks(prev => ({ ...prev, [task.id]: newStatus }));
                }
                
                // Remove loading state
                setTaskLoading(prev => ({ ...prev, [task.id]: false }));
            };

            const syncToGoogleSheet = async (task, isDone) => {
                setIsSyncing(true);
                const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzrlVtOFf5F-uw8VPCr7U7QPU9uCkwDfVYBUy5RoRtG0FC4TNCBahizTYCjd2zQdv5mWg/exec";
                
                const dayIdxMatch = task.id.match(/^d(\d+)-/);
                const taskDayIdx = dayIdxMatch ? parseInt(dayIdxMatch[1], 10) : viewedDayIndex;
                const taskDayId = taskDayIdx + 1;

                const today = new Date();
                const displayDate = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
                
                const payload = {
                    date: displayDate,
                    taskName: `[Day ${taskDayId}] ${task.subject}: ${task.topic}`,
                    status: isDone ? 'checked' : 'unchecked',
                    notes: `Slot: ${task.timeSlot}`
                };

                try {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    return true;
                } catch (error) {
                    console.error("Failed to sync with Google Sheets:", error);
                    return false;
                } finally {
                    setTimeout(() => setIsSyncing(false), 800);
                }
            };

            let totalTasks = 0;
            let completedCount = 0;
            const subStats = {
                maths: { done: 0, total: 0, label: "Mathematics", color: "bg-blue-500" },
                english: { done: 0, total: 0, label: "English", color: "bg-indigo-500" },
                reasoning: { done: 0, total: 0, label: "Reasoning", color: "bg-orange-500" },
                gs: { done: 0, total: 0, label: "Gen. Studies", color: "bg-emerald-500" },
                mock: { done: 0, total: 0, label: "Mocks/Tests", color: "bg-red-500" },
                skill: { done: 0, total: 0, label: "Skill/Typing", color: "bg-teal-500" },
                revision: { done: 0, total: 0, label: "Revision", color: "bg-purple-500" }
            };

            syllabus.forEach(day => {
                day.tasks.forEach(task => {
                    totalTasks++;
                    if (completedTasks[task.id]) completedCount++;
                    
                    if(subStats[task.type]) {
                        subStats[task.type].total++;
                        if (completedTasks[task.id]) subStats[task.type].done++;
                    }
                });
            });
            const progressVal = Math.round((completedCount / totalTasks) * 100) || 0;

            const renderToday = () => {
                const completedToday = viewedData.tasks.filter(t => completedTasks[t.id]).length;
                const totalToday = viewedData.tasks.length;
                // Calculate days left, ensuring it stops at 0
                const daysLeft = Math.max(0, TOTAL_DAYS - actualDayIndex);

                return (
                    <div className="p-4 md:p-6 pb-8 w-full max-w-2xl mx-auto">
                        <div className="mb-6 flex justify-between items-start">
                            <div>
                                <h1 className="text-[22px] sm:text-[26px] font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight flex items-center gap-2 pb-1">
                                    {viewedDayIndex === actualDayIndex ? "Daily Prep" : `Day ${viewedData.dayId} Prep`}
                                    {isSyncing && <i className="fa-solid fa-cloud-arrow-up text-sm text-blue-500 animate-bounce ml-1"></i>}
                                </h1>
                                <div className="flex items-center gap-2 mt-1.5">
                                    <div className="relative">
                                        <p 
                                            onClick={() => setShowDaySelector(!showDaySelector)}
                                            className="text-slate-500 font-semibold flex items-center gap-1 text-xs cursor-pointer hover:text-blue-600 transition-all active:scale-95 select-none"
                                        >
                                            <i className="fa-regular fa-calendar text-blue-500 mr-0.5"></i>
                                            Day {viewedData.dayId} <span className="ml-0.5">• {viewedData.date}</span>
                                            <i className={`fa-solid fa-caret-down text-[10px] ml-0.5 opacity-50 transition-transform ${showDaySelector ? 'rotate-180' : ''}`}></i>
                                        </p>
                                        
                                        {showDaySelector && (
                                            <>
                                                <div className="fixed inset-0 z-40" onClick={() => setShowDaySelector(false)}></div>
                                                <div className="absolute left-0 top-full mt-2 w-52 max-h-64 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl z-50 hide-scrollbar py-1">
                                                    {syllabus.map((day, idx) => (
                                                        <button 
                                                            key={day.dayId}
                                                            onClick={() => { setViewedDayIndex(idx); setShowDaySelector(false); }}
                                                            className={`w-full text-left px-4 py-2.5 text-[13px] transition-colors flex justify-between items-center ${
                                                                idx === viewedDayIndex 
                                                                    ? 'bg-blue-50 text-blue-700 font-bold'
                                                                    : idx === actualDayIndex
                                                                        ? 'text-blue-600 font-semibold bg-white hover:bg-slate-50'
                                                                        : 'text-slate-600 bg-white hover:bg-slate-50'
                                                            }`}
                                                        >
                                                            <span>Day {day.dayId}</span>
                                                            <span className="text-[10px] opacity-70 font-normal">{day.date}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col items-end gap-2">
                                <div className="bg-slate-700 text-slate-100 px-2 py-1 rounded-md text-[11px] font-bold shadow-sm whitespace-nowrap">
                                    {completedToday}/{totalToday} Done
                                </div>
                                <div className="bg-orange-100/40 text-orange-700 px-2 py-1 rounded-md text-[11px] font-bold shadow-sm flex items-center gap-1.5 border border-orange-200/40 whitespace-nowrap">
                                    <i className="fa-solid fa-hourglass-half"></i>
                                    {daysLeft} {daysLeft === 1 ? 'Day' : 'Days'} Left
                                </div>
                            </div>
                        </div>

                        <div className="relative mt-6 space-y-6 -ml-2">
                            <div className="absolute left-[9px] top-4 bottom-8 w-[2px] bg-slate-200 rounded-full z-0"></div>

                            {viewedData.tasks.map((task, idx) => {
                                const isDone = completedTasks[task.id];
                                const isActive = !isDone && isCurrentlyActive(task.timeSlot);
                                const isLoading = taskLoading[task.id];
                                
                                return (
                                    <div key={task.id} className="relative z-10 flex gap-4 items-start group">
                                        <div className="mt-1.5 flex flex-col items-center shrink-0">
                                            <button 
                                                onClick={() => toggleTask(task)}
                                                disabled={isLoading}
                                                className={`w-5 h-5 rounded-full flex items-center justify-center border-2 transition-all duration-300 ease-out shadow-sm
                                                    ${isLoading ? 'bg-slate-200 border-slate-300' : 
                                                        isDone 
                                                            ? 'bg-slate-800 border-slate-800 text-white' 
                                                            : isActive
                                                                ? 'bg-blue-50 border-blue-500'
                                                                : 'bg-white border-slate-300 group-hover:border-slate-400'
                                                    }`}
                                            >
                                                {isLoading ? <i className="fa-solid fa-spinner fa-spin text-[9px] text-slate-500"></i> : (
                                                    isDone && <i className="fa-solid fa-check text-[9px] checkbox-pop"></i>
                                                )}
                                            </button>
                                        </div>

                                        <div 
                                            onClick={() => !isLoading && toggleTask(task)}
                                            className={`flex-1 rounded-2xl p-4 border transition-all cursor-pointer shadow-sm
                                                ${isDone ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-gradient-to-br from-white to-slate-100/30 border-slate-200 hover:shadow-md hover:border-slate-300 hover:to-slate-100/50'}
                                                ${isActive ? 'ring-2 ring-blue-400 ring-offset-2' : ''}
                                                ${isLoading ? 'opacity-70' : ''}
                                            `}
                                        >
                                            <div className="flex flex-wrap gap-2 justify-between items-center mb-2">
                                                <div className="text-xs font-semibold text-slate-500 flex items-center gap-1.5 whitespace-nowrap">
                                                    <i className="fa-regular fa-clock"></i> {task.timeSlot}
                                                </div>
                                                <SubjectPill type={task.type} subject={task.subject} icon={task.icon} />
                                            </div>
                                            <h3 className={`text-sm md:text-base font-bold mt-1 transition-all ${isDone ? 'text-slate-400 line-through' : 'text-slate-800'}`}>
                                                {task.topic}
                                            </h3>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            };

            const renderSchedule = () => (
                <div className="p-4 md:p-6 pb-8 w-full max-w-2xl mx-auto">
                    <h1 className="text-[22px] sm:text-[26px] font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight mb-6 pb-1">Master Blueprint</h1>
                    <div className="space-y-4">
                        {syllabus.map(day => (
                            <div key={day.dayId} className={`rounded-xl border p-4 shadow-sm glass ${day.dayId === actualDayIndex + 1 ? 'bg-blue-50/80 border-blue-200' : 'bg-white/80 border-slate-200'}`}>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 
                                        className="font-bold text-slate-800 cursor-pointer hover:text-blue-600 transition-colors flex items-center gap-2"
                                        onClick={() => {
                                            setViewedDayIndex(day.dayId - 1);
                                            setActiveTab('today');
                                        }}
                                        title="Jump to this day"
                                    >
                                        Day {day.dayId} <span className="text-slate-400 font-normal text-xs ml-2">{day.date}</span>
                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-50"></i>
                                    </h3>
                                    {day.dayId === actualDayIndex + 1 && <span className="text-[10px] bg-blue-600 text-white px-2 py-1 rounded-md font-bold uppercase tracking-wider">Today</span>}
                                </div>
                                <div className="space-y-2">
                                    {day.tasks.map(t => (
                                        <div key={`sch-${t.id}`} className="text-xs flex items-start gap-2">
                                            <div className={`mt-1 w-1.5 h-1.5 rounded-full flex-shrink-0 ${completedTasks[t.id] ? 'bg-green-500' : 'bg-slate-300'}`}></div>
                                            <span className={completedTasks[t.id] ? 'text-slate-400 line-through' : 'text-slate-600'}>
                                                <span className="font-semibold text-slate-700">{t.subject}:</span> {t.topic.replace(/\[.*?\]/, '')}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderStats = () => (
                <div className="p-4 md:p-6 pb-8 w-full max-w-2xl mx-auto flex flex-col items-center">
                    <h1 className="text-[22px] sm:text-[26px] font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight w-full mb-8 pb-1">Detailed Analysis</h1>
                    
                    <div className="relative w-40 h-40 mb-8 shrink-0">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" fill="transparent" stroke="#e2e8f0" strokeWidth="8" />
                            <circle 
                                cx="50" cy="50" r="40" fill="transparent" 
                                stroke="#1e293b" strokeWidth="8" strokeLinecap="round"
                                strokeDasharray={`${2 * Math.PI * 40}`}
                                strokeDashoffset={`${2 * Math.PI * 40 * (1 - progressVal / 100)}`}
                                className="transition-all duration-1000 ease-out"
                            />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="text-4xl font-black text-slate-800 tracking-tighter">{progressVal}%</span>
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Total Done</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 w-full mb-8">
                        <div className="bg-white/80 glass p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <div className="text-3xl font-black text-slate-800">{completedCount}</div>
                            <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mt-1">Tasks Done</div>
                        </div>
                        <div className="bg-white/80 glass p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <div className="text-3xl font-black text-slate-800">{totalTasks - completedCount}</div>
                            <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mt-1">Remaining</div>
                        </div>
                    </div>

                    <div className="w-full bg-white/80 glass p-5 rounded-2xl border border-slate-200 shadow-sm mb-8">
                        <h3 className="font-extrabold text-slate-800 mb-4 tracking-tight">Subject Progress</h3>
                        {Object.keys(subStats).map(key => {
                            const stat = subStats[key];
                            const pct = stat.total === 0 ? 0 : Math.round((stat.done / stat.total) * 100);
                            return (
                                <div key={key} className="mb-4 last:mb-0">
                                    <div className="flex justify-between text-xs font-bold mb-1.5">
                                        <span className="text-slate-700">{stat.label}</span>
                                        <span className="text-slate-500">{stat.done}/{stat.total} ({pct}%)</span>
                                    </div>
                                    <div className="w-full bg-slate-100 rounded-full h-2">
                                        <div className={`h-2 rounded-full ${stat.color} transition-all duration-500`} style={{width: `${pct}%`}}></div>
                                    </div>
                                </div>
                            )
                        })}
                    </div>

                    <a 
                        href="https://docs.google.com/spreadsheets/d/1W0tnRXomGUHBU3sEPWN4jbm_VcA5r0n5kRXJHMGmsTU/edit?usp=sharing"
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="w-full bg-white/90 glass hover:bg-white text-slate-800 border-2 border-slate-200 py-4 rounded-2xl font-extrabold text-[15px] transition-all shadow-sm flex items-center justify-center gap-3 active:scale-95 mb-2"
                    >
                        <i className="fa-solid fa-fire text-orange-500 text-xl"></i> 
                        Open Progress sheet
                    </a>
                    <p className="text-[11px] font-medium text-slate-400 text-center">Live sync with your central database tracking sheet.</p>
                </div>
            );

            return (
                <div className="h-full w-full flex flex-col relative bg-transparent z-10">
                    {/* Main Scrollable Content Box */}
                    <div className="flex-1 overflow-y-auto hide-scrollbar w-full">
                        {activeTab === 'today' && renderToday()}
                        {activeTab === 'schedule' && renderSchedule()}
                        {activeTab === 'stats' && renderStats()}
                    </div>

                    {/* Fixed Flex-Shrink Bottom Navigation Bar */}
                    <div className="bg-gradient-to-br from-white/95 to-slate-100/30 backdrop-blur-md w-full px-6 pt-3 pb-safe border-t border-slate-200 flex-shrink-0 relative z-50">
                        <div className="max-w-md mx-auto flex justify-between items-center pb-2">
                            <button onClick={() => setActiveTab('today')} className={`flex flex-col items-center gap-1 transition-all w-16 ${activeTab === 'today' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                <i className="fa-solid fa-calendar-day text-xl"></i>
                                <span className="text-[10px] font-bold">Today</span>
                            </button>
                            <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center gap-1 transition-all w-16 ${activeTab === 'schedule' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                <i className="fa-solid fa-layer-group text-xl"></i>
                                <span className="text-[10px] font-bold">Plan</span>
                            </button>
                            <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-1 transition-all w-16 ${activeTab === 'stats' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                <i className="fa-solid fa-chart-pie text-xl"></i>
                                <span className="text-[10px] font-bold">Stats</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
