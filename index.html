            const [zenMode, setZenMode] = React.useState(false);

            const [noiseActive, setNoiseActive] = React.useState(false);
            const noiseContextRef = React.useRef(null);
            
            const toggleNoise = () => {
                if (noiseActive) {
                    if (noiseContextRef.current) noiseContextRef.current.suspend();
                    setNoiseActive(false);
                } else {
                    if (!noiseContextRef.current) {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const bufferSize = 2 * ctx.sampleRate,
                        noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate),
                        output = noiseBuffer.getChannelData(0);
                        let lastOut = 0;
                        for (let i = 0; i < bufferSize; i++) {
                            let white = Math.random() * 2 - 1;
                            output[i] = (lastOut + (0.02 * white)) / 1.02; // Brown noise approximation
                            lastOut = output[i];
                            output[i] *= 3.5; 
                        }
                        const noise = ctx.createBufferSource();
                        noise.buffer = noiseBuffer;
                        noise.loop = true;
                        const gainNode = ctx.createGain();
                        gainNode.gain.value = 0.1; // Low volume
                        noise.connect(gainNode);
                        gainNode.connect(ctx.destination);
                        noise.start(0);
                        noiseContextRef.current = ctx;
                    } else {
                        noiseContextRef.current.resume();
                    }
                    setNoiseActive(true);
                }
            };

            const playAlertSound = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                } catch(e) {}
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };
            // --- END NEW FEATURES STATE ---

            // Calculate actual today index once
            const getActualDayIndex = () => {
                const todayDateMidnight = new Date();
                todayDateMidnight.setHours(0, 0, 0, 0);
                const startStr = new Date(START_DATE);
                startStr.setHours(0, 0, 0, 0);
                const diffTime = todayDateMidnight - startStr;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                return Math.max(0, Math.min(diffDays, 89));
            };
            
            const actualDayIndex = getActualDayIndex();
            const [viewedDayIndex, setViewedDayIndex] = React.useState(actualDayIndex);

            const [completedTasks, setCompletedTasks] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('mission90_completed_tasks');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            });

            React.useEffect(() => {
                localStorage.setItem('mission90_completed_tasks', JSON.stringify(completedTasks));
            }, [completedTasks]);
            
            const todayDate = new Date();
            const nowTime = todayDate.getHours() * 100 + todayDate.getMinutes(); 
            
            const viewedData = syllabus[viewedDayIndex];
            const allTodayTasks = [...viewedData.tasks, ...(customTasks[viewedData.dayId] || [])];

            const completedTodayCount = allTodayTasks.filter(t => completedTasks[t.id]).length;
            const totalTodayCount = allTodayTasks.length;

            React.useEffect(() => {
                if (totalTodayCount > 0 && completedTodayCount === totalTodayCount && !confettiFiredDays[viewedData.dayId]) {
                    if (window.confetti) {
                        window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#3b82f6', '#14b8a6', '#f59e0b', '#ec4899'] });
                    }
                    setConfettiFiredDays(prev => ({...prev, [viewedData.dayId]: true}));
                }
            }, [completedTodayCount, totalTodayCount, viewedData.dayId, confettiFiredDays]);

            const isCurrentlyActive = (timeSlotStr) => {
                if (viewedDayIndex !== actualDayIndex) return false;
                try {
                    const parts = timeSlotStr.split(' - ');
                    const parseTime = (str) => {
                        let [time, modifier] = str.split(' ');
                        let [hours, minutes] = time.split(':');
                        hours = parseInt(hours, 10);
                        if (hours === 12 && modifier === 'AM') hours = 0;
                        if (modifier === 'PM' && hours < 12) hours += 12;
                        return hours * 100 + parseInt(minutes, 10);
                    };
                    const start = parseTime(parts[0]);
                    const end = parseTime(parts[1]);
                    return nowTime >= start && nowTime < end;
                } catch(e) { return false; }
            };

            const toggleTask = async (task) => {
                if (taskLoading[task.id]) return; // Prevent double clicking while syncing

                const newStatus = !completedTasks[task.id];
                
                // Show loading state for this specific task
                setTaskLoading(prev => ({ ...prev, [task.id]: true }));
                
                // Wait for the sync to complete
                const success = await syncToGoogleSheet(task, newStatus);
                
                // Once successful, update the UI tick mark
                if (success) {
                    setCompletedTasks(prev => ({ ...prev, [task.id]: newStatus }));
                }
                
                // Remove loading state
                setTaskLoading(prev => ({ ...prev, [task.id]: false }));
            };

            const syncToGoogleSheet = async (task, isDone) => {
                setIsSyncing(true);
                const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzrlVtOFf5F-uw8VPCr7U7QPU9uCkwDfVYBUy5RoRtG0FC4TNCBahizTYCjd2zQdv5mWg/exec";
                
                const dayIdxMatch = task.id.match(/^d(\d+)-/);
                const taskDayIdx = dayIdxMatch ? parseInt(dayIdxMatch[1], 10) : viewedDayIndex;
                const taskDayId = taskDayIdx + 1;

                const today = new Date();
                const displayDate = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
                
                const payload = {
                    date: displayDate,
                    taskName: `[Day ${taskDayId}] ${task.subject}: ${task.topic}`,
                    status: isDone ? 'checked' : 'unchecked',
                    notes: `Slot: ${task.timeSlot}`
                };

                try {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    return true;
                } catch (error) {
                    console.error("Failed to sync with Google Sheets:", error);
                    return false;
                } finally {
                    setTimeout(() => setIsSyncing(false), 800);
                }
            };

            let totalTasks = 0;
            let completedCount = 0;
            const subStats = {
                maths: { done: 0, total: 0, label: "Mathematics", color: "bg-blue-500" },
                english: { done: 0, total: 0, label: "English", color: "bg-indigo-500" },
                reasoning: { done: 0, total: 0, label: "Reasoning", color: "bg-orange-500" },
                gs: { done: 0, total: 0, label: "Gen. Studies", color: "bg-emerald-500" },
                mock: { done: 0, total: 0, label: "Mocks/Tests", color: "bg-red-500" },
                skill: { done: 0, total: 0, label: "Skill/Typing", color: "bg-teal-500" },
                revision: { done: 0, total: 0, label: "Revision", color: "bg-purple-500" },
                custom: { done: 0, total: 0, label: "Custom Tasks", color: "bg-pink-500" }
            };

            syllabus.forEach(day => {
                const combinedTasks = [...day.tasks, ...(customTasks[day.dayId] || [])];
                combinedTasks.forEach(task => {
                    totalTasks++;
                    if (completedTasks[task.id]) completedCount++;
                    
                    if(subStats[task.type]) {
                        subStats[task.type].total++;
                        if (completedTasks[task.id]) subStats[task.type].done++;
                    }
                });
            });
            const progressVal = Math.round((completedCount / totalTasks) * 100) || 0;

            const handleExportData = () => {
                const data = { completedTasks, customTasks, confettiFiredDays };
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Mission90-Backup-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.completedTasks) setCompletedTasks(data.completedTasks);
                        if (data.customTasks) setCustomTasks(data.customTasks);
                        if (data.confettiFiredDays) setConfettiFiredDays(data.confettiFiredDays);
                        alert("Backup restored successfully!");
                    } catch (err) {
                        alert("Invalid backup file.");
                    }
                };
                reader.readAsText(file);
            };

            let currentStreak = 0;
            for (let i = actualDayIndex; i >= 0; i--) {
                const dayPlan = syllabus[i];
                if (!dayPlan) break;
                const combinedTasks = [...dayPlan.tasks, ...(customTasks[dayPlan.dayId] || [])];
                const hasCompleted = combinedTasks.some(t => completedTasks[t.id]);
                if (hasCompleted) currentStreak++;
                else break;
            }

            const handleAddCustomTask = (e) => {
                e.preventDefault();
                if (!newTaskInput.trim()) return;
                const newTask = {
                    id: `custom-${Date.now()}`,
                    timeSlot: "Anytime",
                    subject: "Custom Task",
                    topic: newTaskInput.trim(),
                    type: "custom",
                    icon: "fa-star"
                };
                setCustomTasks(prev => ({
                    ...prev,
                    [viewedData.dayId]: [...(prev[viewedData.dayId] || []), newTask]
                }));
                setNewTaskInput("");
            };

            const handleDeleteCustomTask = (taskId, dayId) => {
                setCustomTasks(prev => {
                    const updated = (prev[dayId] || []).filter(t => t.id !== taskId);
                    return { ...prev, [dayId]: updated };
                });
            };

            const renderToday = () => {
                const completedToday = allTodayTasks.filter(t => completedTasks[t.id]).length;
                const totalToday = allTodayTasks.length;
                // Calculate days left, ensuring it stops at 0
                const daysLeft = Math.max(0, TOTAL_DAYS - actualDayIndex);

                return (
                    <div className="px-4 md:px-6 pb-8 w-full max-w-2xl mx-auto">
                        {/* Sticky Top Header Area with Top Gap 4 (pt-4) so it stays visible on scroll */}
                        <div className="sticky top-0 z-30 bg-white/95 backdrop-blur-md pt-4 pb-3.5 mb-4 border-b border-slate-100/80 -mx-4 px-4 md:-mx-6 md:px-6">
                            <div className="flex flex-col gap-2.5">
                                <div className="flex justify-between items-center">
                                    <h1 className="text-[22px] sm:text-[26px] font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight flex items-center gap-2">
                                        {viewedDayIndex === actualDayIndex ? "Daily Prep" : `Day ${viewedData.dayId} Prep`}
                                        {isSyncing && <i className="fa-solid fa-cloud-arrow-up text-sm text-blue-500 animate-bounce ml-1"></i>}
                                    </h1>
                                    <div className="flex items-center gap-2">
                                        <div className="bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 font-extrabold text-[13px] whitespace-nowrap">
                                            {completedToday}/{totalToday} Done
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center">
                                    <div className="relative">
                                        <p 
                                            onClick={() => setShowDaySelector(!showDaySelector)}
                                            className="text-slate-500 font-semibold flex items-center gap-1 text-xs cursor-pointer hover:text-blue-600 transition-all active:scale-95 select-none"
                                        >
                                            <i className="fa-regular fa-calendar mr-0.5"></i>
                                            Day {viewedData.dayId} <span className="ml-0.5">• {viewedData.date}</span>
                                            <i className={`fa-solid fa-caret-down text-[10px] ml-0.5 opacity-50 transition-transform ${showDaySelector ? 'rotate-180' : ''}`}></i>
                                        </p>
                                        
                                        {showDaySelector && (
                                            <>
                                                <div className="fixed inset-0 z-40" onClick={() => setShowDaySelector(false)}></div>
                                                <div className="absolute left-0 top-full mt-2 w-52 max-h-64 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl z-50 hide-scrollbar py-1">
                                                    {syllabus.map((day, idx) => (
                                                        <button 
                                                            key={day.dayId}
                                                            onClick={() => { setViewedDayIndex(idx); setShowDaySelector(false); }}
                                                            className={`w-full text-left px-4 py-2.5 text-[13px] transition-colors flex justify-between items-center ${
                                                                idx === viewedDayIndex 
                                                                    ? 'bg-blue-50 text-blue-700 font-bold'
                                                                    : idx === actualDayIndex
                                                                        ? 'text-blue-600 font-semibold bg-white hover:bg-slate-50'
                                                                        : 'text-slate-600 bg-white hover:bg-slate-50'
                                                            }`}
                                                        >
                                                            <span>Day {day.dayId}</span>
                                                            <span className="text-[10px] opacity-70 font-normal">{day.date}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                    <div className="flex gap-3 items-center">
                                        {currentStreak > 0 && (
                                            <div className="text-orange-500 font-bold text-xs flex items-center gap-1" title="Current Streak">
                                                <i className="fa-solid fa-fire"></i> {currentStreak}
                                            </div>
                                        )}
                                        <div className="text-slate-500 font-semibold text-xs flex items-center gap-1 whitespace-nowrap">
                                            <i className="fa-solid fa-hourglass-half"></i>
                                            {daysLeft} {daysLeft === 1 ? 'Day' : 'Days'} Left
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-indigo-50 to-blue-50/50 border border-indigo-100 rounded-xl py-2.5 px-4 mb-5 shadow-sm flex gap-3 items-center relative overflow-hidden min-h-[50px]">
                            <div className="absolute -top-3 -right-2 text-indigo-100/50 transform rotate-12">
                                <i className="fa-solid fa-quote-right text-[60px]"></i>
                            </div>
                            <i className="fa-solid fa-quote-left text-indigo-400 relative z-10 text-[15px] shrink-0 self-start mt-0.5"></i>
                            <div className="relative z-10 flex-1">
                                <p className="text-[13px] sm:text-[14px] font-bold text-indigo-900/90 italic pr-4 leading-tight">
                                    "{dailyQuotes[(viewedData.dayId - 1) % dailyQuotes.length]}"
                                </p>
                            </div>
                        </div>

                        {/* Task List Container */}
                        <div className="relative space-y-6 -ml-2">
                            <div className="absolute left-[9px] top-4 bottom-8 w-[2px] bg-slate-200 rounded-full z-0"></div>

                            {allTodayTasks.map((task, idx) => {
                                const isDone = completedTasks[task.id];
                                const isActive = !isDone && isCurrentlyActive(task.timeSlot);
                                const isLoading = taskLoading[task.id];
                                
                                return (
                                    <div key={task.id} className="relative z-10 flex gap-4 items-start group">
                                        <div className="mt-1.5 flex flex-col items-center shrink-0">
                                            <button 
                                                onClick={() => toggleTask(task)}
                                                disabled={isLoading}
                                                className={`w-5 h-5 rounded-full flex items-center justify-center border-2 transition-all duration-300 ease-out shadow-sm
                                                    ${isLoading ? 'bg-slate-200 border-slate-300' : 
                                                        isDone 
                                                            ? 'bg-slate-800 border-slate-800 text-white' 
                                                            : isActive
                                                                ? 'bg-blue-50 border-blue-500'
                                                                : 'bg-white border-slate-300 group-hover:border-slate-400'
                                                    }`}
                                            >
                                                {isLoading ? <i className="fa-solid fa-spinner fa-spin text-[9px] text-slate-500"></i> : (
                                                    isDone && <i className="fa-solid fa-check text-[9px] checkbox-pop"></i>
                                                )}
                                            </button>
                                        </div>

                                        <div 
                                            onClick={() => !isLoading && toggleTask(task)}
                                            className={`flex-1 rounded-2xl p-4 border transition-all cursor-pointer shadow-sm
                                                ${isDone ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-gradient-to-br from-white to-slate-100/30 border-slate-200 hover:shadow-md hover:border-slate-300 hover:to-slate-100/50'}
                                                ${isActive ? 'ring-2 ring-blue-400 ring-offset-2' : ''}
                                                ${isLoading ? 'opacity-70' : ''}
                                            `}
                                        >
                                            <div className="flex flex-wrap gap-2 justify-between items-center mb-2">
                                                <div className="text-xs font-semibold text-slate-500 flex items-center gap-1.5 whitespace-nowrap">
                                                    <i className="fa-regular fa-clock"></i> {task.timeSlot}
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <SubjectPill type={task.type} subject={task.subject} icon={task.icon} />
                                                    {task.type === 'custom' && (
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); handleDeleteCustomTask(task.id, viewedData.dayId); }} 
                                                            className="text-slate-400 hover:text-red-500 transition-colors px-1 py-0.5 active:scale-90" 
                                                            title="Delete custom task"
                                                        >
                                                            <i className="fa-solid fa-trash-can text-xs"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            <h3 className={`text-sm md:text-base font-bold mt-1 transition-all ${isDone ? 'text-slate-400 line-through' : 'text-slate-800'}`}>
                                                {task.topic}
                                            </h3>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                        
                        {/* Add Custom Task Form */}
                        <form onSubmit={handleAddCustomTask} className="mt-6 ml-5 relative z-10 flex gap-2">
                            <input 
                                type="text" 
                                value={newTaskInput}
                                onChange={(e) => setNewTaskInput(e.target.value)}
                                placeholder="Add an extra task for today..." 
                                className="flex-1 bg-white/70 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm"
                            />
                            <button type="submit" disabled={!newTaskInput.trim()} className="bg-slate-800 disabled:opacity-50 hover:bg-slate-700 text-white px-4 py-3 rounded-xl font-bold transition-all active:scale-95 shadow-sm">
                                <i className="fa-solid fa-plus"></i>
                            </button>
                        </form>

                        {viewedDayIndex !== actualDayIndex && (
                            <button 
                                onClick={() => setViewedDayIndex(actualDayIndex)} 
                                className="fixed bottom-24 right-6 bg-blue-600 text-white rounded-full w-[52px] h-[52px] flex items-center justify-center shadow-lg shadow-blue-500/40 z-40 active:scale-95 transition-all hover:bg-blue-700 border-2 border-white animate-bounce"
                                title="Back to Today"
                            >
                                <i className="fa-solid fa-bullseye text-xl"></i>
                            </button>
                        )}
                    </div>
                );
            };

            const renderSchedule = () => {
                const filteredSyllabus = syllabus.map(day => {
                    const combinedTasks = [...day.tasks, ...(customTasks[day.dayId] || [])];
                    
                    const q = searchQuery.toLowerCase();
                    const matchedTasks = combinedTasks.filter(t => {
                        const matchesSearch = !q || t.topic.toLowerCase().includes(q) || t.subject.toLowerCase().includes(q);
                        const matchesFilter = planFilter === 'all' || t.type === planFilter;
                        return matchesSearch && matchesFilter;
                    });
                    
                    return { ...day, tasks: matchedTasks, isMatch: matchedTasks.length > 0 };
                }).filter(day => day.isMatch);

                return (
                <div className="px-4 md:px-6 pb-8 w-full max-w-2xl mx-auto">
                    <div className="sticky top-0 z-30 bg-white/95 backdrop-blur-md pt-4 pb-3 mb-4 border-b border-slate-100/80 -mx-4 px-4 md:-mx-6 md:px-6">
                        <h1 className="text-[22px] sm:text-[26px] font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight pb-1">Master Blueprint</h1>
                        
                        <div className="mt-3 relative">
                            <i className="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input 
                                type="text"
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                placeholder="Search subjects or topics..."
                                className="w-full bg-slate-100 border-none rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner"
                            />
                        </div>

                        <div className="flex gap-2 overflow-x-auto hide-scrollbar mt-3 pb-1 -mx-2 px-2">
                            {[
                                { id: 'all', label: 'All', icon: 'fa-border-all' },
                                { id: 'maths', label: 'Maths', icon: 'fa-square-root-variable' },
                                { id: 'english', label: 'English', icon: 'fa-language' },
                                { id: 'gs', label: 'GS', icon: 'fa-monument' },
                                { id: 'reasoning', label: 'Reasoning', icon: 'fa-puzzle-piece' },
                                { id: 'mock', label: 'Mocks', icon: 'fa-stopwatch' }
                            ].map(filter => (
                                <button 
                                    key={filter.id}
                                    onClick={() => setPlanFilter(filter.id)}
                                    className={`whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors flex items-center gap-1.5
                                        ${planFilter === filter.id

                                            : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}
                                >
                                    <i className={`fa-solid ${filter.icon}`}></i> {filter.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {filteredSyllabus.length === 0 ? (
                        <div className="text-center text-slate-400 py-10 text-sm font-semibold">
                            <i className="fa-solid fa-ghost text-4xl mb-3 opacity-50 block"></i>
                            No topics found for "{searchQuery}"
                        </div>
                    ) : (
                    <div className="space-y-4">
                        {filteredSyllabus.map(day => (
                            <div key={day.dayId} className={`rounded-xl border p-4 shadow-sm glass ${day.dayId === actualDayIndex + 1 ? 'bg-blue-50/80 border-blue-200' : 'bg-white/80 border-slate-200'}`}>
                                <div className="flex justify-between items-center mb-3">

                                            setActiveTab('today');
                                        }}
                                        title="Jump to this day"
                                    >
                                        Day {day.dayId} <span className="text-slate-400 font-normal text-xs ml-2">{day.date}</span>
                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-50"></i>

                                            <div className={`mt-1 w-1.5 h-1.5 rounded-full flex-shrink-0 ${completedTasks[t.id] ? 'bg-green-500' : 'bg-slate-300'}`}></div>
                                            <span className={`flex-1 ${completedTasks[t.id] ? 'text-slate-400 line-through' : 'text-slate-600'}`}>

            const renderTimer = () => {
                if (zenMode) {
                    return (
                        <div className="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center p-6 text-white font-sans overflow-hidden">

                                <i className="fa-solid fa-compress text-2xl"></i>
                            </button>
                            
                            <div className="flex gap-3 p-1.5 bg-slate-800 rounded-2xl mb-12 w-64 shadow-inner">
                                <button onClick={() => {setTimerMode('focus'); setTimerActive(false); setTimeLeft(focusDuration*60);}} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${timerMode === 'focus' ? 'bg-slate-700 text-blue-400 shadow-sm' : 'text-slate-500 hover:text-slate-300'}`}>Focus</button>
                                <button onClick={() => {setTimerMode('break'); setTimerActive(false); setTimeLeft(breakDuration*60);}} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${timerMode === 'break' ? 'bg-slate-700 text-teal-400 shadow-sm' : 'text-slate-500 hover:text-slate-300'}`}>Break</button>
                            </div>
                            
                            <div className="relative w-80 h-80 mb-16 flex items-center justify-center">
                                <svg className="w-full h-full transform -rotate-90 absolute inset-0" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="45" fill="transparent" stroke="#1e293b" strokeWidth="2" />
                                    <circle 
                                        cx="50" cy="50" r="45" fill="transparent" 
                                        stroke={timerMode === 'focus' ? '#3b82f6' : '#14b8a6'} 
                                        strokeWidth="2" 
                                        strokeLinecap="round"
                                        strokeDasharray="283"
                                        strokeDashoffset={283 - (283 * timeLeft) / (timerMode === 'focus' ? focusDuration * 60 : breakDuration * 60)}
                                        className="transition-all duration-1000 ease-linear"
                                    />
                                </svg>
                                <div className="relative z-10 text-center flex flex-col items-center">
                                    <div className="text-7xl font-black tracking-tighter mb-2 font-mono">
                                        {formatTime(timeLeft)}
                                    </div>
                                    <div className={`text-sm font-bold uppercase tracking-widest ${timerMode === 'focus' ? 'text-blue-500' : 'text-teal-500'}`}>
                                        {timerMode === 'focus' ? 'Deep Work' : 'Resting'}
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-6 w-72">
                                <button onClick={() => setTimerActive(!timerActive)} className={`flex-1 py-5 rounded-2xl font-bold text-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3 ${timerActive ? 'bg-amber-500 hover:bg-amber-600 text-slate-900' : (timerMode === 'focus' ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-teal-500 hover:bg-teal-400 text-slate-900')}`}>
                                    {timerActive ? <><i className="fa-solid fa-pause"></i> Pause</> : <><i className="fa-solid fa-play"></i> Start</>}
                                </button>
                                <button onClick={() => { setTimerActive(false); setTimeLeft(timerMode === 'focus' ? focusDuration * 60 : breakDuration * 60); }} className="w-20 flex items-center justify-center rounded-2xl bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white transition-all active:scale-95 text-2xl shadow-md">
                                    <i className="fa-solid fa-rotate-right"></i>
                                </button>
                            </div>
                        </div>
                    );
                }

                return (
                <div className="px-4 md:px-6 pb-8 w-full max-w-2xl mx-auto flex flex-col items-center justify-center h-full min-h-[70vh]">
                    <div className="sticky top-0 z-30 bg-white/95 backdrop-blur-md pt-4 pb-3 mb-4 border-b border-slate-100/80 -mx-4 px-4 md:-mx-6 md:px-6 w-full flex justify-between items-center">
                        <h1 className="text-[22px] sm:text-[26px] font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight pb-1">Pomodoro Focus</h1>
                        <button onClick={() => setShowTimerSettings(!showTimerSettings)} className={`text-xl transition-colors ${showTimerSettings ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                            <i className="fa-solid fa-gear"></i>
                        </button>
                    </div>
                    
                    {showTimerSettings && (
                        <div className="w-full max-w-sm bg-slate-50 border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-slate-700 text-sm">Timer Settings</h3>
                                <button onClick={() => setShowTimerSettings(false)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 mb-1.5 block">Focus Time (min)</label>
                                    <input type="number" min="1" max="120" value={focusDuration} onChange={e => {setFocusDuration(Number(e.target.value)); if(timerMode==='focus' && !timerActive) setTimeLeft(Number(e.target.value)*60);}} className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-center text-slate-700 shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-400" />
                                </div>
                                <div className="flex-1">
                                    <label className="text-[10px] uppercase font-bold text-slate-500 mb-1.5 block">Break Time (min)</label>
                                    <input type="number" min="1" max="60" value={breakDuration} onChange={e => {setBreakDuration(Number(e.target.value)); if(timerMode==='break' && !timerActive) setTimeLeft(Number(e.target.value)*60);}} className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-center text-slate-700 shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-400" />
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white/80 glass p-8 rounded-[2rem] border border-slate-200 shadow-lg flex flex-col items-center mt-2 w-full max-w-sm">
                        <div className="flex gap-2 p-1 bg-slate-100 rounded-xl mb-8 w-full shadow-inner">
                            <button onClick={() => {setTimerMode('focus'); setTimerActive(false); setTimeLeft(focusDuration*60);}} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${timerMode === 'focus' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Focus ({focusDuration}m)</button>
                            <button onClick={() => {setTimerMode('break'); setTimerActive(false); setTimeLeft(breakDuration*60);}} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${timerMode === 'break' ? 'bg-white text-teal-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Break ({breakDuration}m)</button>
                        </div>
                        
                        <div className="relative w-56 h-56 mb-10 flex items-center justify-center drop-shadow-sm">
                            <svg className="w-full h-full transform -rotate-90 absolute inset-0" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="transparent" stroke="#f1f5f9" strokeWidth="3" />
                                <circle 
                                    cx="50" cy="50" r="45" fill="transparent" 
                                    stroke={timerMode === 'focus' ? '#2563eb' : '#0d9488'} 
                                    strokeWidth="3" 
                                    strokeLinecap="round"
                                    strokeDasharray="283"
                                    strokeDashoffset={283 - (283 * timeLeft) / (timerMode === 'focus' ? focusDuration * 60 : breakDuration * 60)}
                                    className="transition-all duration-1000 ease-linear"
                                />
                            </svg>
                            <div className="relative z-10 text-center flex flex-col items-center">
                                <div className="text-5xl font-black text-slate-800 tracking-tighter mb-1 font-mono">
                                    {formatTime(timeLeft)}
                                </div>
                                <div className={`text-[11px] font-bold uppercase tracking-widest ${timerMode === 'focus' ? 'text-blue-500' : 'text-teal-500'}`}>
                                    {timerMode === 'focus' ? 'Deep Work' : 'Resting'}
                                </div>
                            </div>
                        </div>

                        <div className="flex gap-4 w-full">
                            <button onClick={() => setTimerActive(!timerActive)} className={`flex-1 py-4 rounded-xl text-white font-bold text-lg shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 ${timerActive ? 'bg-amber-500 hover:bg-amber-600' : (timerMode === 'focus' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-teal-500 hover:bg-teal-600')}`}>
                                {timerActive ? <><i className="fa-solid fa-pause"></i> Pause</> : <><i className="fa-solid fa-play"></i> Start</>}
                            </button>
                            <button onClick={() => { setTimerActive(false); setTimeLeft(timerMode === 'focus' ? focusDuration * 60 : breakDuration * 60); }} className="w-16 flex items-center justify-center rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all active:scale-95 text-lg">
                                <i className="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                        
                        <div className="mt-6 w-full flex flex-col items-center border-t border-slate-100 pt-5">
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Focus Tools</p>
                            <div className="flex gap-3 w-full">
                                <button 
                                    onClick={toggleNoise}
                                    className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-2 ${noiseActive ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}
                                >
                                    <i className={`fa-solid ${noiseActive ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                                    {noiseActive ? 'Brown Noise' : 'Play Noise'}
                                </button>
                                <button 
                                    onClick={() => setZenMode(true)}
                                    className="flex-1 py-3 rounded-xl text-xs font-bold bg-slate-800 text-white transition-all shadow-sm flex items-center justify-center gap-2 hover:bg-slate-700 active:scale-95"
                                >
                                    <i className="fa-solid fa-expand"></i> Zen Mode
                                </button>
                            </div>
                        </div>

                        <div className="mt-6 w-full bg-slate-50 border border-slate-200 rounded-xl p-4 flex items-center justify-between shadow-inner">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-orange-100 text-orange-500 flex items-center justify-center">
                                    <i className="fa-solid fa-fire text-lg"></i>
                                </div>
                                <div>
                                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Today's Focus</p>
                                    <p className="text-sm font-black text-slate-800">{focusSessions.count} Sessions Completed</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-xl font-black text-blue-600">{focusSessions.totalMinutes}</p>
                                <p className="text-[10px] font-bold text-slate-400 uppercase">Minutes</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
            };

            const renderStats = () => (
                <div className="px-4 md:px-6 pb-8 w-full max-w-2xl mx-auto flex flex-col items-center">
                    <div className="sticky top-0 z-30 bg-white/95 backdrop-blur-md pt-4 pb-3 mb-4 border-b border-slate-100/80 -mx-4 px-4 md:-mx-6 md:px-6 w-full">
                        <h1 className="text-[22px] sm:text-[26px] font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight w-full pb-1">Detailed Analysis</h1>
                    </div>
                    
                    <div className="relative w-40 h-40 mb-8 mt-2 shrink-0">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" fill="transparent" stroke="#e2e8f0" strokeWidth="8" />
                            <circle 
                                cx="50" cy="50" r="40" fill="transparent" 
                                stroke="#1e293b" strokeWidth="8" strokeLinecap="round"
                                strokeDasharray={`${2 * Math.PI * 40}`}
                                strokeDashoffset={`${2 * Math.PI * 40 * (1 - progressVal / 100)}`}
                                className="transition-all duration-1000 ease-out"
                            />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="text-4xl font-black text-slate-800 tracking-tighter">{progressVal}%</span>
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Total Done</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 w-full mb-8">
                        <div className="bg-white/80 glass p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <div className="text-3xl font-black text-slate-800">{completedCount}</div>
                            <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mt-1">Tasks Done</div>
                        </div>
                        <div className="bg-white/80 glass p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <div className="text-3xl font-black text-slate-800">{totalTasks - completedCount}</div>
                            <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mt-1">Remaining</div>
                        </div>
                    </div>

                    {/* NEW: 90-Day Consistency Heatmap */}
                    <div className="w-full bg-white/80 glass p-5 rounded-2xl border border-slate-200 shadow-sm mb-8">
                        <h3 className="font-extrabold text-slate-800 mb-4 tracking-tight flex items-center gap-2">
                            <i className="fa-solid fa-calendar-days text-indigo-500"></i> 90-Day Consistency
                        </h3>
                        <div className="grid grid-cols-10 gap-1.5 sm:gap-2">
                            {syllabus.map(day => {
                                const dayTasks = [...day.tasks, ...(customTasks[day.dayId] || [])];
                                const doneCount = dayTasks.filter(t => completedTasks[t.id]).length;
                                const totalCount = dayTasks.length;
                                
                                let bgClass = "bg-slate-100"; // 0%
                                if (totalCount > 0 && doneCount > 0) {
                                    if (doneCount === totalCount) bgClass = "bg-blue-600 shadow-sm shadow-blue-400/40"; // 100%
                                    else bgClass = "bg-blue-300"; // Partial
                                }

                                // Mark current active day with a border
                                const isToday = day.dayId === actualDayIndex + 1;
                                const borderClass = isToday ? "ring-2 ring-orange-400 ring-offset-1" : "";

                                return (
                                    <div 
                                        key={`heat-${day.dayId}`} 
                                        className={`aspect-square rounded-[4px] sm:rounded-md ${bgClass} ${borderClass} transition-all hover:scale-110 flex items-center justify-center group relative cursor-pointer`}
                                        onClick={() => { setViewedDayIndex(day.dayId - 1); setActiveTab('today'); }}
                                    >
                                        {/* Heatmap Tooltip */}
                                        <div className="absolute bottom-full mb-1.5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 transition-opacity">
                                            Day {day.dayId}: {doneCount}/{totalCount}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="flex justify-end gap-3 mt-4 text-[10px] font-bold text-slate-500 uppercase items-center">
                            <span>Less</span>
                            <div className="flex gap-1">
                                <div className="w-3 h-3 rounded-sm bg-slate-100"></div>
                                <div className="w-3 h-3 rounded-sm bg-blue-300"></div>
                                <div className="w-3 h-3 rounded-sm bg-blue-600"></div>
                            </div>
                            <span>More</span>
                        </div>
                    </div>

                    <div className="w-full bg-white/80 glass p-5 rounded-2xl border border-slate-200 shadow-sm mb-8">
                        <h3 className="font-extrabold text-slate-800 mb-4 tracking-tight flex items-center gap-2">
                            <i className="fa-solid fa-medal text-yellow-500"></i> Achievements
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {[
                                { id: 'first_blood', name: 'First Blood', desc: 'Complete your first task', icon: 'fa-droplet', color: 'text-red-500 bg-red-50 border-red-200', unlocked: completedCount >= 1 },
                                { id: 'streak_3', name: 'On a Roll', desc: 'Achieve a 3-day streak', icon: 'fa-fire', color: 'text-orange-500 bg-orange-50 border-orange-200', unlocked: currentStreak >= 3 },
                                { id: 'streak_7', name: 'Unstoppable', desc: 'Achieve a 7-day streak', icon: 'fa-bolt', color: 'text-yellow-500 bg-yellow-50 border-yellow-200', unlocked: currentStreak >= 7 },
                                { id: 'halfway', name: 'Halfway There', desc: 'Complete 50% of the mission', icon: 'fa-mountain', color: 'text-emerald-500 bg-emerald-50 border-emerald-200', unlocked: progressVal >= 50 },
                                { id: 'scholar', name: 'Scholar', desc: 'Complete 100 tasks', icon: 'fa-book-open-reader', color: 'text-blue-500 bg-blue-50 border-blue-200', unlocked: completedCount >= 100 }
                            ].map(a => (
                                <div key={a.id} className={`p-3 rounded-xl border flex items-center gap-3 transition-all ${a.unlocked ? a.color : 'bg-slate-50 border-slate-200 opacity-60 grayscale'}`}>
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center bg-white shadow-sm shrink-0 ${a.unlocked ? '' : 'text-slate-400'}`}>
                                        <i className={`fa-solid ${a.icon} text-lg`}></i>
                                    </div>
                                    <div>
                                        <div className={`text-sm font-bold ${a.unlocked ? '' : 'text-slate-500'}`}>{a.name}</div>
                                        <div className="text-[10px] text-slate-500 font-medium">{a.desc}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <a 
                        href="https://docs.google.com/spreadsheets/d/1W0tnRXomGUHBU3sEPWN4jbm_VcA5r0n5kRXJHMGmsTU/edit?usp=sharing"
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="w-full bg-white/90 glass hover:bg-white text-slate-800 border-2 border-slate-200 py-4 rounded-2xl font-extrabold text-[15px] transition-all shadow-sm flex items-center justify-center gap-3 active:scale-95 mb-2"
                    >
                        <i className="fa-solid fa-fire text-orange-500 text-xl"></i> 
                        Open Progress sheet
                    </a>
                    <p className="text-[11px] font-medium text-slate-400 text-center mb-6">Live sync with your central database tracking sheet.</p>

                    <div className="w-full bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-sm mb-6">
                        <h3 className="font-extrabold text-slate-800 mb-3 tracking-tight flex items-center gap-2">
                            <i className="fa-solid fa-database text-blue-500"></i> Data Management
                        </h3>
                        <p className="text-xs text-slate-500 mb-4 leading-relaxed">Download a backup file of your progress or restore from a previously saved backup.</p>
                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={handleExportData} className="px-4 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-xl text-xs font-bold hover:bg-slate-50 transition-all shadow-sm flex items-center justify-center gap-2">
                                <i className="fa-solid fa-download"></i> Export
                            </button>
                            <button onClick={() => fileInputRef.current.click()} className="px-4 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-xl text-xs font-bold hover:bg-slate-50 transition-all shadow-sm flex items-center justify-center gap-2">
                                <i className="fa-solid fa-upload"></i> Import
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleImportData} accept=".json" className="hidden" />
                        </div>
                    </div>

                    {showResetConfirm ? (
                        <div className="w-full bg-red-50 p-4 rounded-2xl border border-red-200 mt-2 text-center shadow-inner">
                            <p className="text-xs text-red-600 font-bold mb-3">Are you sure? This will wipe all completed tasks permanently.</p>
                            <div className="flex gap-3 justify-center">
                                <button onClick={() => setShowResetConfirm(false)} className="px-5 py-2 text-xs font-bold bg-white text-slate-600 rounded-lg border border-slate-200 shadow-sm active:scale-95 transition-all">Cancel</button>
                                <button onClick={() => { setCompletedTasks({}); setCustomTasks({}); setShowResetConfirm(false); }} className="px-5 py-2 text-xs font-bold bg-red-500 hover:bg-red-600 text-white rounded-lg shadow-sm active:scale-95 transition-all">Yes, Reset All</button>
                            </div>
                        </div>
                    ) : (
                        <button onClick={() => setShowResetConfirm(true)} className="w-full py-3 text-xs font-bold text-slate-400 hover:text-red-500 transition-colors mt-2">
                            <i className="fa-solid fa-trash-can mr-1"></i> Reset All Progress
                        </button>
                    )}
                </div>
            );

            return (
                <div className="h-full w-full flex flex-col relative bg-transparent z-10">
                    {/* Main Scrollable Content Box */}
                    <div className="flex-1 overflow-y-auto hide-scrollbar w-full">
                        {activeTab === 'today' && renderToday()}
                        {activeTab === 'schedule' && renderSchedule()}
                        {activeTab === 'timer' && renderTimer()}
                        {activeTab === 'stats' && renderStats()}
                    </div>

                    {/* Fixed Flex-Shrink Bottom Navigation Bar */}
                    {!zenMode && (
                        <div className="bg-gradient-to-br from-white/95 to-slate-100/30 backdrop-blur-md w-full px-6 pt-3 pb-safe border-t border-slate-200 flex-shrink-0 relative z-50">
                            <div className="max-w-md mx-auto flex justify-between items-center pb-2">
                                <button onClick={() => setActiveTab('today')} className={`flex flex-col items-center gap-1 transition-all w-16 ${activeTab === 'today' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-calendar-day text-xl"></i>
                                    <span className="text-[10px] font-bold">Today</span>
                                </button>
                                <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center gap-1 transition-all w-16 ${activeTab === 'schedule' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-layer-group text-xl"></i>
                                    <span className="text-[10px] font-bold">Plan</span>
                                </button>
                                <button onClick={() => setActiveTab('timer')} className={`flex flex-col items-center gap-1 transition-all w-16 ${activeTab === 'timer' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-stopwatch text-xl"></i>
                                    <span className="text-[10px] font-bold">Timer</span>
                                </button>
                                <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-1 transition-all w-16 ${activeTab === 'stats' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <i className="fa-solid fa-chart-pie text-xl"></i>
                                    <span className="text-[10px] font-bold">Stats</span>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
