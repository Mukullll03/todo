<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Prep Checklist</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- App Icons & PWA Settings -->
    <link rel="icon" type="image/jpeg" href="https://framerusercontent.com/images/DGPdl3nBCOFyGKcpCA3RRw5QM2M.jpg?scale-down-to=512&width=1200&height=1200">
    <link rel="apple-touch-icon" href="https://framerusercontent.com/images/DGPdl3nBCOFyGKcpCA3RRw5QM2M.jpg?scale-down-to=512&width=1200&height=1200">
    <meta name="theme-color" content="#f0f9ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f9ff;
            color: #0c4a6e;
        }

        /* Ambient Background Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        
        /* Glass styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px -10px rgba(2, 132, 199, 0.1);
        }

        /* Task Card Animations */
        .task-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .task-card:active { transform: scale(0.98); }
        .task-card.completed {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            border-color: #7dd3fc;
        }

        /* Pop Animation for Checkmark */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Toast Notification Animation */
        @keyframes toastFadeInOut {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            15% { opacity: 1; transform: translateY(0) scale(1); }
            85% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(15px) scale(0.95); }
        }
        .animate-toast { animation: toastFadeInOut 2.5s ease-in-out forwards; }
    </style>
</head>
<body class="relative min-h-screen overflow-x-hidden flex flex-col selection:bg-sky-200 selection:text-sky-900">

    <!-- Ambient Light Blue Background -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-sky-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
    </div>

    <!-- Header -->
    <header class="w-full max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 pt-8 sm:pt-12 z-10">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl sm:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-sky-600 to-blue-600 tracking-tight">
                    Daily Prep
                </h1>
                <p class="text-sky-700/80 font-medium mt-1 text-lg" id="currentDateDisplay">Loading date...</p>
            </div>
            <div class="glass-panel px-5 py-2.5 rounded-2xl flex items-center gap-3 w-full sm:w-auto justify-center">
                <div class="w-2 h-2 rounded-full bg-emerald-400 transition-colors duration-300" id="syncDot"></div>
                <span class="text-sm font-bold tracking-wide text-sky-800" id="progressText">0 / 6 Completed</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-white/50 rounded-full h-3 backdrop-blur-sm shadow-inner p-0.5 overflow-hidden border border-white">
            <div id="progressBar" class="h-full rounded-full bg-gradient-to-r from-cyan-400 via-sky-500 to-blue-500 transition-all duration-700 ease-out shadow-sm" style="width: 0%"></div>
        </div>
    </header>

    <!-- Main Content: Task List -->
    <main class="flex-1 w-full max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 z-10 pb-20">
        <div id="taskGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
            <!-- Tasks injected via JS -->
        </div>
    </main>

    <!-- Modal Overlay for Loading & Result -->
    <div id="modalOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-sky-900/40 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none hidden px-4">
        
        <!-- Loading Spinner State -->
        <div id="loadingBox" class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4 hidden">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-sky-500"></i>
            <span class="text-sky-800 font-medium text-lg animate-pulse">Syncing with server...</span>
        </div>
        
        <!-- Result/Action Modal State -->
        <div id="resultBox" class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl max-w-sm w-full flex flex-col items-center text-center gap-4 hidden transform scale-95 transition-transform duration-300">
            <div id="resultIconWrapper" class="w-16 h-16 rounded-full flex items-center justify-center mb-2">
                <i id="resultIcon" class="fa-solid text-2xl"></i>
            </div>
            <h3 id="resultTitle" class="text-xl font-extrabold text-sky-900">Updated</h3>
            <p id="resultMessage" class="text-sky-700 font-medium"></p>
            <button onclick="closeModal()" class="mt-4 w-full bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl transition-all shadow-md hover:shadow-lg">
                OK
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 INDEPENDENT TASK SYNC URL
        // ==========================================
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz6nCMRlnIN24Eyk3rqKmBBO1-nJ7OCqV27xXJ6KLsV08S6b-xV5Jv0SK_u2uu239eoUw/exec"; 
        
        // --- App Data ---
        const tasks = [
            { id: 'vocab', label: 'Daily Vocabulary', icon: 'fa-book-open' },
            { id: 'editorial', label: 'Read Editorial', icon: 'fa-align-left' },
            { id: 'pqrs', label: 'PQRS Jumbles', icon: 'fa-pen-nib' },
            { id: 'typing', label: 'Typing Practice', icon: 'fa-keyboard' },
            { id: 'maths', label: 'Quick Maths Drill', icon: 'fa-calculator' },
            { id: 'mock', label: 'Sectional Mock Test', icon: 'fa-bullseye' }
        ];

        let state = {
            completed: []
        };

        // --- DOM Elements ---
        const els = {
            grid: document.getElementById('taskGrid'),
            progressBar: document.getElementById('progressBar'),
            progressText: document.getElementById('progressText'),
            dateDisplay: document.getElementById('currentDateDisplay'),
            syncDot: document.getElementById('syncDot'),
            // Modal Elements
            modalOverlay: document.getElementById('modalOverlay'),
            loadingBox: document.getElementById('loadingBox'),
            resultBox: document.getElementById('resultBox'),
            resultIconWrapper: document.getElementById('resultIconWrapper'),
            resultIcon: document.getElementById('resultIcon'),
            resultMessage: document.getElementById('resultMessage')
        };

        // --- Initialize ---
        function init() {
            const today = new Date();
            els.dateDisplay.textContent = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            
            const savedData = localStorage.getItem(`prep_tracker_${today.toDateString()}`);
            if (savedData) {
                state.completed = JSON.parse(savedData);
            }

            renderTasks();
            updateProgress();
        }

        // --- Render UI ---
        function renderTasks() {
            els.grid.innerHTML = '';
            
            tasks.forEach(task => {
                const isDone = state.completed.includes(task.id);
                
                const card = document.createElement('div');
                card.className = `task-card cursor-pointer p-5 sm:p-6 rounded-3xl flex items-center justify-between border-2 ${
                    isDone 
                        ? 'completed bg-gradient-to-br from-sky-50 to-blue-50 border-sky-200 shadow-sm' 
                        : 'glass-panel border-transparent hover:bg-white hover:shadow-md'
                }`;
                
                card.onclick = () => toggleTask(task.id);

                card.innerHTML = `
                    <div class="flex items-center gap-4 sm:gap-5">
                        <div class="w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center rounded-2xl transition-colors ${
                            isDone ? 'bg-sky-500 text-white shadow-md' : 'bg-sky-100 text-sky-600'
                        }">
                            <i class="fa-solid ${task.icon} text-xl sm:text-2xl"></i>
                        </div>
                        <span class="font-bold text-lg sm:text-xl ${isDone ? 'text-sky-900' : 'text-sky-800'}">${task.label}</span>
                    </div>
                    <div class="w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all ${
                        isDone ? 'border-sky-500 bg-sky-500 text-white' : 'border-sky-200 bg-white/50'
                    }">
                        ${isDone ? '<i class="fa-solid fa-check text-sm animate-pop"></i>' : ''}
                    </div>
                `;
                
                els.grid.appendChild(card);
            });
        }

        // --- Logic ---
        function toggleTask(id) {
            const taskObj = tasks.find(t => t.id === id);
            const isCurrentlyChecked = state.completed.includes(id);
            const status = isCurrentlyChecked ? 'unchecked' : 'checked';

            // 1. Show the loading modal immediately during the time gap
            showLoadingModal();

            // 2. Sync to server and wait for it to finish
            syncSpecificTask(taskObj.label, status).then(() => {
                // 3. Update the state AFTER sync completes successfully
                if (status === 'checked') {
                    state.completed.push(id);
                } else {
                    state.completed = state.completed.filter(taskId => taskId !== id);
                }
                
                // Save locally so a page refresh doesn't clear the list
                localStorage.setItem(`prep_tracker_${new Date().toDateString()}`, JSON.stringify(state.completed));
                
                // Update UI visually (Checkmarks & Progress)
                renderTasks();
                updateProgress();
                
                // 4. Transform loading circle into the success modal with OK button
                showResultModal(taskObj.label, status);
            });
        }

        function updateProgress() {
            const count = state.completed.length;
            const total = tasks.length;
            const percentage = (count / total) * 100;
            
            els.progressBar.style.width = `${percentage}%`;
            els.progressText.textContent = `${count} / ${total} Completed`;
        }

        // --- Modal Display Logic ---
        function showLoadingModal() {
            els.modalOverlay.classList.remove('hidden');
            els.modalOverlay.classList.remove('pointer-events-none');
            
            // Allow display block to apply before fading in
            requestAnimationFrame(() => {
                els.modalOverlay.classList.remove('opacity-0');
            });
            
            els.loadingBox.classList.remove('hidden');
            els.resultBox.classList.add('hidden');
        }

        function showResultModal(taskName, status) {
            els.loadingBox.classList.add('hidden');
            els.resultBox.classList.remove('hidden');
            
            // Pop animation on result box
            els.resultBox.classList.remove('scale-95');
            els.resultBox.classList.add('scale-100');

            const isDone = status === 'checked';
            
            // Update styling based on action
            if (isDone) {
                els.resultIconWrapper.className = 'w-16 h-16 rounded-full flex items-center justify-center mb-2 bg-emerald-100 text-emerald-500 shadow-inner';
                els.resultIcon.className = 'fa-solid fa-check text-3xl animate-pop';
                els.resultMessage.innerHTML = `<b>${taskName}</b> has been saved as completed.`;
            } else {
                els.resultIconWrapper.className = 'w-16 h-16 rounded-full flex items-center justify-center mb-2 bg-sky-100 text-sky-500 shadow-inner';
                els.resultIcon.className = 'fa-solid fa-arrow-rotate-left text-3xl animate-pop';
                els.resultMessage.innerHTML = `<b>${taskName}</b> has been unchecked.`;
            }
        }

        function closeModal() {
            els.modalOverlay.classList.add('opacity-0');
            els.resultBox.classList.remove('scale-100');
            els.resultBox.classList.add('scale-95');
            els.modalOverlay.classList.add('pointer-events-none');
            
            setTimeout(() => {
                els.modalOverlay.classList.add('hidden');
            }, 300); // Matches transition duration
        }

        // --- Webhook Sync (Targeted) ---
        function syncSpecificTask(taskName, status) {
            // Give visual feedback (yellow = syncing)
            els.syncDot.classList.replace('bg-emerald-400', 'bg-amber-400');
            els.syncDot.classList.add('animate-pulse');

            // Format date strictly as YYYY-MM-DD so sheets never gets confused
            const today = new Date();
            const dateString = today.getFullYear() + "-" + 
                               String(today.getMonth() + 1).padStart(2, '0') + "-" + 
                               String(today.getDate()).padStart(2, '0');

            const payload = {
                date: dateString,
                taskName: taskName,
                status: status // 'checked' or 'unchecked'
            };

            // Send to Google Sheets AND return the promise to wait for completion
            return fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).then(() => {
                // Visual feedback (green = success)
                setTimeout(() => {
                    els.syncDot.classList.replace('bg-amber-400', 'bg-emerald-400');
                    els.syncDot.classList.remove('animate-pulse');
                }, 800);
            }).catch(error => {
                console.error("Error sending to sheets:", error);
            });
        }

        // Start App
        init();
    </script>
</body>
</html>
